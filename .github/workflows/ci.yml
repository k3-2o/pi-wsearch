name: ci

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3

      - name: install
        run: bun install --frozen-lockfile

      - name: lint
        run: bun run lint

      - name: format
        run: bun run format:check

      - name: typecheck
        run: bun run typecheck

      - name: knip
        run: bun run knip

      - name: test
        run: bun run test

      - name: coverage
        run: bun run coverage

      - name: package
        run: npm pack --dry-run
